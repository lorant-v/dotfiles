---
- name: Bootstrap local workstation
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Install packages
      vars:
        packages:
          - build-essential
          - ca-certificates
          - git
          - gh
          - curl
          - man-db
      become: true
      ansible.builtin.package:
        name: "{{ packages }}"
        state: present
        update_cache: true

    - name: Setup opencode-sandbox
      vars:
        sandbox_repo: "https://github.com/lorant-v/opencode-sandbox.git"
        sandbox_parent_dir: "{{ ansible_env.HOME }}/.local/share"
        sandbox_dir: "{{ sandbox_parent_dir }}/opencode-sandbox"
      block:
        - name: Ensure parent directory exists
          ansible.builtin.file:
            path: "{{ sandbox_parent_dir }}"
            state: directory
            mode: "0755"

        - name: Clone repository
          ansible.builtin.git:
            repo: "{{ sandbox_repo }}"
            dest: "{{ sandbox_dir }}"
            version: HEAD
            update: true

        - name: Run installer
          ansible.builtin.command:
            chdir: "{{ sandbox_dir }}"
            cmd: "./install/install.sh"
