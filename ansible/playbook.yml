---
- name: Bootstrap local workstation
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    packages:
      - git
      - gh
    sandbox_repo: "https://github.com/lorant-v/opencode-sandbox.git"
    sandbox_dir: "{{ ansible_env.HOME }}/.local/share/opencode-sandbox"
    sandbox_parent_dir: "{{ ansible_env.HOME }}/.local/share/"

  tasks:
    - ansible.builtin.import_tasks: tasks/packages.yml
    - ansible.builtin.import_tasks: tasks/opencode-sandbox.yml