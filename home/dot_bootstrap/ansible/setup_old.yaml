---
- name: Bootstrap local workstation
  hosts: all
  gather_facts: true

  tasks:

    - name: Install oh-my-bash
      vars:
        oh_my_bash_repo: "https://github.com/ohmybash/oh-my-bash.git"
        oh_my_bash_dir: "{{ ansible_env.HOME }}/.oh-my-bash"
      ansible.builtin.git:
        repo: "{{ oh_my_bash_repo }}"
        dest: "{{ oh_my_bash_dir }}"
        version: master
        update: true

    - name: Install mise
      ansible.builtin.shell: curl https://mise.run | sh
      args:
        creates: "{{ ansible_env.HOME }}/.local/bin/mise"

    - name: Install global mise tools
      ansible.builtin.command:
        cmd: "{{ ansible_env.HOME }}/.local/bin/mise install"
      changed_when: false

    - name: Install opencode-sandbox
      when: false
      vars:
        sandbox_repo: "https://github.com/lorant-v/opencode-sandbox.git"
        sandbox_parent_dir: "{{ ansible_env.HOME }}/.local/share"
        sandbox_dir: "{{ sandbox_parent_dir }}/opencode-sandbox"
      block:
        - name: Ensure parent directory exists
          ansible.builtin.file:
            path: "{{ sandbox_parent_dir }}"
            state: directory
            mode: "0755"

        - name: Clone repository
          ansible.builtin.git:
            repo: "{{ sandbox_repo }}"
            dest: "{{ sandbox_dir }}"
            version: HEAD
            update: true

        - name: Run installer
          ansible.builtin.command:
            chdir: "{{ sandbox_dir }}"
            cmd: "./install/install.sh"