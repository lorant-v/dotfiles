---
- name: Set up workstation
  hosts: all
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Detect WSL
      ansible.builtin.set_fact:
        is_wsl: "{{ 'wsl' in (ansible_facts['kernel'] | lower) }}"

  roles:
    - role: common

    - role: linux
      when: ansible_system == "Linux"

    - role: ubuntu
      when: ansible_distribution in ["Ubuntu", "Debian"]

    - role: wsl
      when: is_wsl
