---
# Packages present on all supported platforms via the system package manager.
# ansible.builtin.package dispatches to apt/pacman/brew automatically.
# Platform-specific tools that don't exist cross-platform are handled in
# their respective roles respectively.

- name: Install packages
  ansible.builtin.package:
    name:
      - git
      - curl
      - wget
      - htop
      - tmux
      - ripgrep
    state: present
  become: true

- name: Install oh-my-bash
  vars:
    oh_my_bash_repo: "https://github.com/ohmybash/oh-my-bash.git"
    oh_my_bash_dir: "{{ ansible_env.HOME }}/.oh-my-bash"
  ansible.builtin.git:
    repo: "{{ oh_my_bash_repo }}"
    dest: "{{ oh_my_bash_dir }}"
    version: master
    update: true

- name: Install mise
  ansible.builtin.shell: curl https://mise.run | sh
  args:
    creates: "{{ ansible_env.HOME }}/.local/bin/mise"